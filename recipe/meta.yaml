{% set name = "pot" %}
{% set version = "0.9.7.post1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # PyPI sdist, not the GitHub archive: the archive omits the deps/eigen
  # submodule that the ot.bsp extension needs (Eigen/Dense).
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 2edd70845047ac2d378487b980a2bffb5ff58e9b92b7133896ff5753f6300cec
  # The sdist ships test/ flattened and without conftest.py, which provides the
  # `nx` fixture every test needs; take it from the matching upstream tag.
  - url: https://raw.githubusercontent.com/PythonOT/POT/{{ version }}/test/conftest.py
    sha256: ae4c8517928049eaa7db7c6e23792d73628c74f371ccf7e3f0287f21a3cf1189

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - setuptools >=42
    - cython >=0.23
    - numpy {{ numpy }}  # [py>=39]
    - llvm-openmp  # [osx or (win and arm64)] analint: host_section_needs_exact_pinnings  # exact pin arrives via run_exports
    - libgomp  # [linux] analint: host_section_needs_exact_pinnings  # exact pin arrives via run_exports
    - vcomp14  # [win and x86_64]
  run:
    - python
    - llvm-openmp  # [osx or (win and arm64)]
    - libgomp  # [linux]
    - vcomp14  # [win and x86_64]
    # numpy pinning arrives via run_exports from the host numpy build
    - numpy
    - scipy >=1.6

# E   ModuleNotFoundError: No module named 'openmp_helpers'
{% set ignore_tests = "--ignore=test/test_helpers.py" %}
# >       index[0] = generator.choice(len_p, size=1, p=nx.to_numpy(p))
# E       ValueError: setting an array element with a sequence.
{% set deselect_tests = "--deselect=test/gromov/test_estimators.py::test_pointwise_gromov" %}
# >               M[-1, -1] = 1 / s
# E               ValueError: setting an array element with a sequence.
{% set deselect_tests = deselect_tests + " --deselect=test/test_regpath.py::test_fully_relaxed_path" %}
{% set deselect_tests = deselect_tests + " --deselect=test/test_regpath.py::test_semi_relaxed_path" %}

test:
  source_files:
    - test
    - conftest.py
  imports:
    - ot
    - ot.lp
    - ot.partial
    - ot.bsp
  requires:
    - pip
    - pytest
    # scipy >=1.17 fails tests on linux/osx; win-arm64 only ships >=1.17.1
    - scipy <1.17  # [not (win and arm64)]
  commands:
    - pip check
    - pytest -vv test {{ ignore_tests }} {{ deselect_tests }}

about:
  home: https://github.com/PythonOT/POT
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python Optimal Transport library
  description: |
    This open source Python library provide several solvers for optimization
    problems related to Optimal Transport for signal, image processing and
    machine learning.
  doc_url: https://pythonot.github.io
  dev_url: https://github.com/PythonOT/POT

extra:
  recipe-maintainers:
    - djsutherland
    - rflamary
